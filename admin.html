<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin PMR</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container">

        <span class="navbar-brand fw-bold">
            <i class="bi bi-shield-lock-fill"></i>
            ADMIN PMR
        </span>

        <!-- KEMBALI KE INDEX -->
        <a href="index.html" class="btn btn-light btn-sm">
            <i class="bi bi-house-fill"></i>
            Dashboard
        </a>

    </div>
</nav>

<div class="container">

    <div class="admin-login">

        <div class="admin-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h2 class="text-center">
            Login Admin
        </h2>

        <p class="text-center text-muted">
            Panel Admin Voting PMR
        </p>

        <div class="mb-3">
            <label class="form-label fw-bold">
                Username
            </label>

            <input
                type="text"
                id="usernameAdmin"
                class="form-control form-control-lg"
                placeholder="Masukkan username"
            >
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">
                Password
            </label>

            <input
                type="password"
                id="passwordAdmin"
                class="form-control form-control-lg"
                placeholder="Masukkan password"
            >
        </div>

        <button onclick="loginAdmin()" class="btn btn-danger btn-lg w-100">
            <i class="bi bi-box-arrow-in-right"></i>
            Login
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
<footer class="footer">
    <div class="container text-center">
        <p class="mb-1">
            <i class="bi bi-heart-pulse-fill"></i>
            Voting PMR SMKN 2 Kota Mojokerto
        </p>

        <small>
            © 2026 Dibuat oleh <strong>Yoga</strong>
        </small>
    </div>
</footer>

</html>
